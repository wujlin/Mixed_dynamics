<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 54px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 600 28px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .body  { font: 500 26px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 500 22px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .muted { font: 500 22px Arial, Helvetica, sans-serif; fill: #334155; }
      .stroke { stroke: #64748b; stroke-width: 3; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 3; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Panel background -->
  <rect x="20" y="20" width="1560" height="860" rx="28" class="panel" />
  <text x="80" y="110" class="title">Empirical Validation</text>

  <!-- Top pipeline: posts -> filter -> database -->
  <!-- Posts icon (stacked cards) -->
  <g transform="translate(90,150)">
    <rect x="18" y="18" width="240" height="120" rx="16" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="8" y="8" width="240" height="120" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="0" y="0" width="240" height="120" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="40" cy="38" r="10" fill="#94a3b8"/>
    <rect x="60" y="30" width="160" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="24" y="62" width="196" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="24" y="86" width="150" height="14" rx="7" fill="#e2e8f0"/>
    <text x="0" y="165" class="muted">Social media posts</text>
  </g>

  <!-- Arrow to filter -->
  <line x1="360" y1="210" x2="550" y2="210" class="stroke" marker-end="url(#arrow)"/>

  <!-- Filter icon -->
  <g transform="translate(600,150)">
    <path d="M0,0 H220 L145,90 V150 L75,150 V90 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M20,20 H200 L135,90 V130 L85,130 V90 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
    <text x="-10" y="165" class="muted">Filter &amp; processing</text>
  </g>

  <!-- Arrow to database -->
  <line x1="860" y1="210" x2="1050" y2="210" class="stroke" marker-end="url(#arrow)"/>

  <!-- Database icon -->
  <g transform="translate(1100,150)">
    <ellipse cx="120" cy="20" rx="110" ry="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="10" y="20" width="220" height="120" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <ellipse cx="120" cy="140" rx="110" ry="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <ellipse cx="120" cy="80" rx="110" ry="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
    <text x="40" y="185" class="muted">Time series</text>
  </g>

  <!-- Mapping box -->
  <g transform="translate(120,360)">
    <rect x="0" y="0" width="1360" height="150" rx="20" class="box"/>
    <text x="40" y="55" class="body">
      <tspan>Theory → Data: </tspan>
      <tspan>r → r</tspan><tspan baseline-shift="sub" font-size="70%">proxy</tspan>
      <tspan>, q → Q, a → a</tspan>
    </text>
    <text x="40" y="110" class="body">Volatility: std(Q)</text>
  </g>

  <!-- Bottom: H1 and H2 mini plots -->
  <!-- H1: jump in |Q| -->
  <g transform="translate(160,560)">
    <text x="0" y="-18" class="label">H1: a → jump in |Q|</text>
    <!-- axes -->
    <line x1="0" y1="240" x2="460" y2="240" class="stroke"/>
    <line x1="0" y1="240" x2="0" y2="0" class="stroke"/>
    <text x="430" y="275" class="small">time</text>
    <text x="-10" y="-12" class="small">|Q|</text>
    <!-- time series with jump -->
    <path d="M20,220 L120,218 L200,220 L260,70 L360,72 L430,210"
          fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- H2: std(Q) -->
  <g transform="translate(840,560)">
    <text x="0" y="-18" class="label">
      <tspan>H2: r</tspan><tspan baseline-shift="sub" font-size="70%">proxy</tspan><tspan> → std(Q)</tspan>
    </text>
    <!-- axes -->
    <line x1="0" y1="240" x2="460" y2="240" class="stroke"/>
    <line x1="0" y1="240" x2="0" y2="0" class="stroke"/>
    <text x="380" y="275" class="small">
      <tspan>r</tspan><tspan baseline-shift="sub" font-size="70%">proxy</tspan>
    </text>
    <text x="-10" y="-12" class="small">std(Q)</text>
    <!-- scatter -->
    <g fill="#2563eb" opacity="0.95">
      <circle cx="60" cy="210" r="7"/>
      <circle cx="95" cy="205" r="7"/>
      <circle cx="130" cy="198" r="7"/>
      <circle cx="165" cy="188" r="7"/>
      <circle cx="200" cy="176" r="7"/>
      <circle cx="235" cy="160" r="7"/>
      <circle cx="270" cy="142" r="7"/>
      <circle cx="305" cy="120" r="7"/>
      <circle cx="340" cy="95" r="7"/>
      <circle cx="380" cy="75" r="7"/>
      <circle cx="420" cy="55" r="7"/>
    </g>
  </g>
</svg>

